<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>js thing</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
            #yourcanvas {
                background-color: black;
                width: 100%;
                height: 100vh;
            }
        </style>
    </head>
    <body>


        <canvas id = "yourcanvas"></canvas>
    </body>
    <script>
        var canvas = document.getElementById("yourcanvas");

        var sizeMult = canvas.height / 1080;
        console.log(sizeMult);
        console.log(canvas.height);
        
        canvas.addEventListener("click", function() {
            canvas.requestFullscreen();
        });
        
        window.addEventListener("resize", (e) => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineWidth = 6;
            sizeMult = canvas.height / 1080;
            console.log(sizeMult);
            console.log(canvas.height);
        });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var ctx = canvas.getContext("2d");
        ctx.strokeStyle = "rgba(255, 0, 0, 0.2)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(150, 150, 25, 0, Math.PI * 2);
        ctx.stroke();
        
        var lerp = function(a,b,t){
            return a+(b-a)*t;
        }
        var easings = {
            easeOutQuad: (x) => {
                return 1 - (1 - x) * (1 - x);
            },
            easeInSine: (x) => {
                return 1 - Math.cos(x * Math.PI / 2);
            }
        };
        var screenshake = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            screenshakeMult: 7,
            shake(mag, dx, dy) {
                mag *= this.screenshakeMult * sizeMult;
                var dir = arguments.length !== 1? Math.atan2(dy, dx): Math.random() * Math.PI * 2;
                this.vx += Math.cos(dir) * mag;
                this.vy += Math.sin(dir) * mag;
            },
            update: function() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.8;
                this.vy *= 0.8;
                this.vx -= this.x / 7;
                this.vy -= this.y / 7;
            }
        };

        function mixRGBA(foreground, background) {
            const [r1, g1, b1, a1] = foreground;
            const [r2, g2, b2, a2] = background;

            // Calculate final alpha
            const aOut = a1 + a2 * (1 - a1);
            
            if (aOut === 0) return [0, 0, 0, 0];

            // Calculate final RGB components
            const rOut = Math.round((r1 * a1 + r2 * a2 * (1 - a1)) / aOut);
            const gOut = Math.round((g1 * a1 + g2 * a2 * (1 - a1)) / aOut);
            const bOut = Math.round((b1 * a1 + b2 * a2 * (1 - a1)) / aOut);

            return [rOut, gOut, bOut, Number(aOut.toFixed(2))];
        }

        var Vect = function(x, y) {
            this.x = x || 0;
            this.y = y || 0;
        };
        Vect.prototype.add = function(v, y) {
            if(arguments.length === 1) {
                this.x += v.x;
                this.y += v.y;
            }
            else {
                this.x += v;
                this.y += y;
            }
        };
        Vect.prototype.sub = function(v) {
            this.x -= v.x;
            this.y -= v.y;
        };
        Vect.prototype.mag = function() {
            return Math.sqrt(this.x * this.x + this.y * this.y);
        };
        Vect.prototype.normalize = function() {
            var mag = Math.sqrt(this.x * this.x + this.y * this.y);
            this.x /= mag;
            this.y /= mag;
        };
        Vect.prototype.mult = function(m) {
            this.x *= m;
            this.y *= m;
        };
        Vect.prototype.div = function(m) {
            this.x /= m;
            this.y /= m;
        };
        Vect.prototype.set = function(v) {
            this.x = v.x;
            this.y = v.y;
        };
        Vect.prototype.rotate = function(angle) {
            var newX = Math.cos(angle) * this.x - Math.sin(angle) * this.y,
                newY = Math.sin(angle) * this.x + Math.cos(angle) * this.y;
            this.x = newX;
            this.y = newY;
        };
        Vect.lerp = function(v1,v2,t){
            return new Vect(lerp(v1.x, v2.x, t), lerp(v1.y, v2.y, t));
        }
        Vect.get = function(v) {
            return new Vect(v.x, v.y);
        };
        Vect.sub = function(v1, v2) {
            return new Vect(v1.x - v2.x, v1.y - v2.y);
        };
        Vect.add = function(v1, v2) {
            return new Vect(v1.x + v2.x, v1.y + v2.y);
        };
        Vect.mult = function(v, m) {
            return new Vect(v.x * m, v.y * m);
        };
        Vect.div = function(v, m) {
            return new Vect(v.x / m, v.y / m);
        };
        Vect.normalize = function(v) {
            let mag = v.mag();
            return new Vect(v.x / mag, v.y / mag);
        };
        
        var fireworks = [];
        var fireworkParticles = [];
        var cols = [
            [255,0,0],
            [0,255,0],
            [0,120,255],
            
            [255, 125, 0],//orng
            [200, 200, 50],//yllow
            [0, 0, 255],//drkblue
        ];
        var dist = function(x, y, x2, y2) {
            return Math.sqrt((x - x2) * (x - x2) + (y - y2) * (y - y2));
        };
        const phi = (Math.sqrt(5) + 1) / 2;//golden
        class Firework {
            static gravity = () => 0.05 * sizeMult;
            static launchVel = () => 8 * sizeMult;
            static size = () => 7 * sizeMult;
            static phiRot = phi * Math.PI * 2;
            static particleSpawnVel = () => 10 * sizeMult;//for the big circle of particles
            constructor(pos, col, type) {
                this.pos = Vect.get(pos);
                let yLaunchMult = lerp(0.8, 1.1, Math.random());
                let xLaunchOffset = lerp(-5, 5, Math.random());
                this.vel = new Vect((canvas.width/2 - pos.x) / canvas.width*4, -Firework.launchVel() * yLaunchMult);
                this.type = type;
                this.col = `hsl(${lerp(25, 50, Math.random())}, 75%, 50%)`;
                this.particleCol = col;

                this.timer = -this.vel.y / Firework.gravity() * lerp(0.95, 1.05, Math.random());
                //this.col = col || `oklch(0.7285 0.1455 ${Math.random() * 360})`;
                this.dead = false;
            }

            update() {
                this.vel.y += Firework.gravity();//gravity
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    this.dead = true;
                    screenshake.shake(1);

                    let rotAmt = 0;
                    let fireworkSize = lerp(0.9, 1.2, Math.random()) * Firework.particleSpawnVel();
                    for(var dst = 0; dst <= 1; dst += 0.01) {
                        let sqrtDst = easings.easeInSine(Math.sqrt(dst));
                        rotAmt += Firework.phiRot;
                        let vel = new Vect(
                            Math.cos(rotAmt) * sqrtDst * fireworkSize,
                            Math.sin(rotAmt) * sqrtDst * fireworkSize
                        );
                        fireworkParticles.push(new FireworkPart(this.pos, vel, this.particleCol));
                    }
                }
                else if(Math.random() < 0.8) {
                    fireworkParticles.push(new FireworkTrail(this.pos, Vect.mult(this.vel, -0.2)));
                }
            }

            display() {
                ctx.fillStyle = this.col;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, Firework.size(), 0, Math.PI * 2);
                ctx.fill();
            }

            go() {
                this.update();
                this.display();
            }
        }

        class FireworkPart extends Firework {
            static size = () => 5*sizeMult;

            constructor(pos, vel, col) {
                super(pos);
                this.col = col;
                this.timer = lerp(60, 100, Math.random() * Math.random());
                this.startTimer = this.timer;
                this.vel.set(vel);
                this.vel.add(new Vect(Math.random() - 0.5, Math.random() - 0.5));
                this.friction = lerp(0.95, 0.96, Math.random());
                this.gravity = lerp(0.2, 0.4, Math.random());
                this.sizeMult = lerp(0.8, 1.2, Math.random());
            }

            update() {
                this.vel.y += Firework.gravity() * this.gravity;
                this.vel.mult(this.friction);
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    this.dead = true;
                }
                if(Math.random() < lerp(0.15, 0.05, easings.easeOutQuad(1-this.timer/this.startTimer))) {
                    fireworkParticles.push(new FireworkTrail(this.pos, Vect.mult(this.vel, -0.2)));
                }
            }

            display() {
                let t = Math.max(0, lerp(-4, 1, 1-this.timer/this.startTimer));
                let alpha = 1 - easings.easeOutQuad(t);
                ctx.fillStyle = this.col;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, FireworkPart.size() * this.sizeMult, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class FireworkTrail extends Firework {
            static size = () => 20*sizeMult;
            static smokeCol = [100, 100, 100, 0.1];
            constructor(pos, vel, col) {
                super(pos);
                this.timer = lerp(30, 45, Math.random());
                this.startTimer = this.timer;
                this.vel.set(Vect.add(vel, new Vect(Math.random() * 4 - 2, Math.random() * 4 - 2)));
            }

            update() {
                this.vel.y += Firework.gravity() * 0.5;//gravity
                this.vel.mult(0.95);
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    this.dead = true;
                }
            }

            display() {
                let alpha = FireworkTrail.smokeCol[3] * (1 - easings.easeOutQuad(1-this.timer / this.startTimer));
                ctx.fillStyle = `rgba(${FireworkTrail.smokeCol.slice(0, 3).join(", ")}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, FireworkTrail.size(), 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        
        var draw = function() {
            //background
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            //stuff
            screenshake.update();
            ctx.save();
            ctx.translate(screenshake.x, screenshake.y);
            let amt = (Math.sin(Date.now() / 10000)+1)/2;
            if(Math.random() <= lerp(0.025, 0.08, amt)){
                let x = lerp(canvas.width / 5, canvas.width * 4/5, Math.random());
                fireworks.push(new Firework(new Vect(x, canvas.height), `hsl(${Math.random()*360}, 75%, 50%)`));
                
            }
            for(var i = 0;i<fireworkParticles.length;i++){
                fireworkParticles[i].go(i);
                if(fireworkParticles[i].dead){
                    fireworkParticles.splice(i,1);
                    i --;
                }
            }
            for(var i = 0;i<fireworks.length;i++){
                fireworks[i].go(i);
                if(fireworks[i].dead){
                    fireworks.splice(i,1);
                    i --;
                }
            }
            ctx.fillStyle = "white";
            let fontSize = canvas.width / 16;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.save();
            ctx.translate(canvas.width / 2, fontSize);
            let scale = Math.sin(Date.now() / 500) * 0.05 + 1;
            let rotation = Math.sin(Date.now() / 500 * phi) * 0.08;
            ctx.scale(scale, scale);
            ctx.rotate(rotation);
            ctx.fillText("HAPPY BIRTHDAY DAD!!!!!!!!!", 0, 0);
            ctx.restore();
            ctx.restore();
            window.requestAnimationFrame(draw);
        };
        window.requestAnimationFrame(draw);
        
        
        
        
        
        
        
    </script>
</html>
