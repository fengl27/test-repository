    <script>
        var audioCtx = new AudioContext();
        var gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);
        var SOUNDS = {};
        function loadSound(name,success,err) {
            var request = new XMLHttpRequest();
            request.open('GET', name)
            request.responseType = 'arraybuffer'
            request.onload = function() {
                audioCtx.decodeAudioData(request.response, function(buffer) {
                    SOUNDS[name] = buffer;
                    (success || (function(){}))()
                }, err || function(msg) {console.error(msg)});
            }
            request.send();
        }
        function playSound(name,param) {
            param = param || {}
            var s = SOUNDS[name]
            var source = audioCtx.createBufferSource()
            source.buffer = s
            if (param.loop) {
                source.loop = true
            }
            source.connect(audioCtx.destination);
            // set the value of the pitch here
            if(param.pitch) source.detune.value = param.pitch// value of pitch
            if(param.volume) {
                gainNode.gain.value = param.volume;
                source.connect(gainNode);
            }
            source.start(0);
        }
    </script>

        var screenshake = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            screenshakeMult: 7,
            shake(mag, dx, dy) {
                mag *= this.screenshakeMult * sizeMult;
                var dir = arguments.length !== 1? Math.atan2(dy, dx): Math.random() * Math.PI * 2;
                this.vx += Math.cos(dir) * mag;
                this.vy += Math.sin(dir) * mag;
            },
            update: function() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.8;
                this.vy *= 0.8;
                this.vx -= this.x / 7;
                this.vy -= this.y / 7;
            }
        };

        function mixRGBA(foreground, background) {
            const [r1, g1, b1, a1] = foreground;
            const [r2, g2, b2, a2] = background;

            // Calculate final alpha
            const aOut = a1 + a2 * (1 - a1);
            
            if (aOut === 0) return [0, 0, 0, 0];

            // Calculate final RGB components
            const rOut = Math.round((r1 * a1 + r2 * a2 * (1 - a1)) / aOut);
            const gOut = Math.round((g1 * a1 + g2 * a2 * (1 - a1)) / aOut);
            const bOut = Math.round((b1 * a1 + b2 * a2 * (1 - a1)) / aOut);

            return [rOut, gOut, bOut, Number(aOut.toFixed(2))];
        }

        var Vect = function(x, y) {
            this.x = x || 0;
            this.y = y || 0;
        };
        Vect.prototype.add = function(v, y) {
            if(arguments.length === 1) {
                this.x += v.x;
                this.y += v.y;
            }
            else {
                this.x += v;
                this.y += y;
            }
        };
        Vect.prototype.sub = function(v) {
            this.x -= v.x;
            this.y -= v.y;
        };
        Vect.prototype.mag = function() {
            return Math.sqrt(this.x * this.x + this.y * this.y);
        };
        Vect.prototype.normalize = function() {
            var mag = Math.sqrt(this.x * this.x + this.y * this.y);
            this.x /= mag;
            this.y /= mag;
        };
        Vect.prototype.mult = function(m) {
            this.x *= m;
            this.y *= m;
        };
        Vect.prototype.div = function(m) {
            this.x /= m;
            this.y /= m;
        };
        Vect.prototype.set = function(v) {
            this.x = v.x;
            this.y = v.y;
        };
        Vect.prototype.rotate = function(angle) {
            var newX = Math.cos(angle) * this.x - Math.sin(angle) * this.y,
                newY = Math.sin(angle) * this.x + Math.cos(angle) * this.y;
            this.x = newX;
            this.y = newY;
        };
        Vect.lerp = function(v1,v2,t){
            return new Vect(lerp(v1.x, v2.x, t), lerp(v1.y, v2.y, t));
        }
        Vect.get = function(v) {
            return new Vect(v.x, v.y);
        };
        Vect.sub = function(v1, v2) {
            return new Vect(v1.x - v2.x, v1.y - v2.y);
        };
        Vect.add = function(v1, v2) {
            return new Vect(v1.x + v2.x, v1.y + v2.y);

        Vect.mult = function(v, m) {
            return new Vect(v.x * m, v.y * m);

        Vect.div = function(v, m) {
            return new Vect(v.x / m, v.y / m);
        };
        Vect.normalize = function(v) {

            return new Vect(v.x / mag, v.y / mag);
        };

        function coordinateIn1DArray(array, x, y, width, mult=1, offset=0) {
            x = Math.floor(x); y = Math.floor(y);
            if(x < 0 || x >= width || y < 0 || y >= width) return 0;
            return array[(x + y*width)*mult+offset];
        }
        class Firework {
            static gravity = () => 0.05 * sizeMult;
            static launchVel = () => 8 * sizeMult;
            static size = () => 7 * sizeMult;
            static phiRot = phi * Math.PI * 2;
            static particleSpawnVel = () => 10 * sizeMult;//for the big circle of particles

            static types = [
                0, 1, 2, 3, 4, 5, "tri", "star", "sixPointStar", "creeper"
            ];
            static generateCol = function() {
                return `oklch(0.6929 0.1565 ${Math.random()*360})`;
            }
            constructor(pos, col, type, yLaunchMult, delay) {
                if(this.constructor.name === "Firework" && !delay) {
                    sounds.fire.playSound();
                }
                this.pos = Vect.get(pos);
                let xLaunchDir = yLaunchMult? 0: (canvas.width/2 - pos.x) / canvas.width*4;
                let xLaunchOffset = lerp(-0.8*sizeMult, 0.8*sizeMult, Math.random());
                if(yLaunchMult) xLaunchOffset *= 0.2;
                var yLaunchMult = yLaunchMult || lerp(0.8, 1.1, Math.random());
                this.vel = new Vect(xLaunchDir + xLaunchOffset, -Firework.launchVel() * yLaunchMult);
                this.type = type;
                this.col = `hsl(${lerp(25, 50, Math.random())}, 75%, 50%)`;
                this.particleCol = col;

                this.timer = -this.vel.y / Firework.gravity() * lerp(0.95, 1.05, Math.random());
                //this.col = col || `oklch(0.7285 0.1455 ${Math.random() * 360})`;
                this.dead = false;
                this.delay = delay || 0;
            }

            explode(rotation, startRot, col) {
                let rotAmt = startRot || (Math.random() * Math.PI * 2);
                let fireworkSize = lerp(0.9, 1.1, Math.random()) * Firework.particleSpawnVel();
                col = col || this.particleCol;
                for(var dst = 0; dst <= 1; dst += 0.01) {
                    let sqrtDst = easings.easeInSine(Math.sqrt(dst)) * fireworkSize;
                    rotAmt += rotation;
                    let vel = new Vect(
                        Math.cos(rotAmt) * sqrtDst,
                        Math.sin(rotAmt) * sqrtDst
                    );
                    fireworkParticles.push(new FireworkPart(this.pos, vel, col));
                }
            }

            explodeWithLetter(rotation, letter) {
                let width = letterThings.thingSize;
                let rotAmt = Math.random() * Math.PI * 2;
                let fireworkSize = lerp(0.9, 1.1, Math.random()) * Firework.particleSpawnVel();
                for(var dst = 0; dst <= 1; dst += 0.002) {
                    let sqrtDst = Math.sqrt(dst)*sqrt2;
                    rotAmt += rotation;
                    let vel = new Vect(
                        Math.cos(rotAmt) * sqrtDst,
                        Math.sin(rotAmt) * sqrtDst
                    );
                    if(coordinateIn1DArray(
                        letter,
                        lerp(width/2, width, vel.x),//width/2 because vel.x can go negative
                        lerp(width/2, width, vel.y),
                        width, 4
                    ) !== 0) {
                        //wow we can do the thing ig
                        vel.x *= fireworkSize;
                        vel.y *= fireworkSize;
                        fireworkParticles.push(new FireworkPart(this.pos, vel, this.particleCol, 0.2));
                    }
                }
            }

            update() {
                if(this.delay > 0) {
                    this.delay --;
                    if(this.delay <= 0) {
                        sounds.fire.playSound();
                    }
                    return;
                }
                this.vel.y += Firework.gravity();//gravity
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    sounds.explode.playSound();
                    this.dead = true;
                    screenshake.shake(1);

                    switch(this.type) {
                        case 0:
                            this.explode(Firework.phiRot);
                            break;
                        case 1://triangle spiral
                            this.explode(2/3*Math.PI+0.04);
                            break;
                        case 2://ccw triangle spiral
                            this.explode(2/3 * Math.PI - 0.04);
                            break;
                        case 3://double spiral
                            var rand = Math.random() * Math.PI * 2;
                            this.explode(2/3 * Math.PI + 0.01, rand);
                            this.explode(2/3 * Math.PI + 0.01, rand + Math.PI, Firework.generateCol());
                            break;
                        case 4://ccw double spiral
                            var rand = Math.random() * Math.PI * 2;
                            this.explode(2/3 * Math.PI - 0.01, rand);
                            this.explode(2/3 * Math.PI - 0.01, rand + Math.PI, Firework.generateCol());
                            break;
                        case 5://double random spiral
                            var rand = Math.random() * Math.PI * 2;
                            this.explode(Firework.phiRot, rand);
                            this.explode(Firework.phiRot, rand + Math.PI, Firework.generateCol());
                            break;
                        default:
                            this.explodeWithLetter(Firework.phiRot, letterThings[this.type]);
                            break;
                    }
                }
                else if(Math.random() < 0.8) {
                    fireworkParticles.push(new FireworkTrail(this.pos, Vect.mult(this.vel, -0.2)));
                }
            }

            display() {
                if(this.delay > 0) return;
                ctx.fillStyle = this.col;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, Firework.size(), 0, Math.PI * 2);
                ctx.fill();
            }

            go() {
                this.update();
                this.display();
            }
        }

        class FireworkPart extends Firework {
            static size = () => 5*sizeMult;

            constructor(pos, vel, col, randomnessMult=1) {
                super(pos);
                this.col = col;
                this.timer = lerp(60, 100, Math.random() * Math.random());
                this.startTimer = this.timer;
                this.vel.set(vel);
                this.vel.add(
                    new Vect(
                        randomnessMult * (Math.random() - 0.5),
                        randomnessMult * (Math.random() - 0.5)
                    )
                );
                this.friction = lerp(0.95, 0.97, Math.random() * randomnessMult);
                this.gravity = lerp(0.2, 0.4, Math.random());
                this.sizeMult = lerp(0.8, 1.2, Math.random());
            }

            update() {
                this.vel.y += Firework.gravity() * lerp(this.gravity, 1, easings.easeInSine(1-this.timer/this.startTimer));
                this.vel.mult(this.friction);
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    this.dead = true;
                }
                if(Math.random() < lerp(0.15, 0.05, easings.easeOutQuad(1-this.timer/this.startTimer))) {
                    fireworkParticles.push(new FireworkTrail(this.pos, Vect.mult(this.vel, -0.2)));
                }
            }

            display() {
                let t = Math.max(0, lerp(-4, 1, 1-this.timer/this.startTimer));
                let alpha = 1 - easings.easeOutQuad(t);
                ctx.fillStyle = this.col;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, FireworkPart.size() * this.sizeMult * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class FireworkTrail extends Firework {
            static size = () => 20*sizeMult;
            static smokeCol = [100, 100, 100, 0.1];
            constructor(pos, vel, col) {
                super(pos);
                this.timer = lerp(30, 45, Math.random());
                this.startTimer = this.timer;
                this.vel.set(Vect.add(vel, new Vect(Math.random() * 4 - 2, Math.random() * 4 - 2)));

            update() {
                this.vel.y += Firework.gravity() * 0.5;//gravity
                this.vel.mult(0.95);
                this.pos.add(this.vel);
                this.timer --;
                if(this.timer < 0) {
                    this.dead = true;
                }
            }

            display() {
                let alpha = FireworkTrail.smokeCol[3] * (1 - easings.easeOutQuad(1-this.timer / this.startTimer));
                ctx.fillStyle = `rgba(${FireworkTrail.smokeCol.slice(0, 3).join(", ")}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, FireworkTrail.size(), 0, Math.PI * 2);
                ctx.fill();
            }
        }
