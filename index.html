<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #181818;
            padding: 10px;
            user-select: none;
        }
        body > div > div {
            border: 2px solid black;
        }
        input {
            padding: 6px 15px 6px 15px;
            border: 2px solid black;
            background-color: #025b02;
            color: white;
            font-size: 18px;
            font-family: monospace;
            transition: all ease-in-out 0.1s;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            display: none;
        }

        input[type=button]:hover, input[type=number]:focus {
            background-color: #025002;
            outline: none;
        }
        input[type=button]:active {
            background-color: #01400d;
        }
        #save-id-label {
            color: white;
            font-size: 18px;
            font-family: monospace;
        }
        #button-container, #save-id-container {
            border: none;
            flex: 1;
        }
        #save-id-container {
            text-align: right;
        }
        #ui-container {
            position:absolute;
            left: 20px;
            right: 20px;
            bottom: 20px;
            display: flex;
            height: fit-content;
            flex-direction: row;
        }
    </style>
</head>
<body>
    <div>
        <strudel-editor rows = "5">

        </strudel-editor>
    </div>
    <div id = "ui-container">
        <div id = "button-container">
            <input type = "button" id="button" value = "Save">
            <input type = "button" id="pause" value = "Pause">
        </div>

        <div id = "save-id-container">
            <label for = "save-id" id = "save-id-label">Save id:</label>
            <input type = "number" id = "save-id" value = "0" min = "0" max = "99">
        </div>
    </div>
</body>
<script>
    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
        let expires = "expires="+d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }
    function getCookie(cname) {
        let name = cname + "=";
        let ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }
    var txt = JSON.parse(window.localStorage.getItem("funky-funky-music-music"));
    const editor = document.querySelector("strudel-editor");
    var saveId = 0;
    var saveIdEl = document.getElementById("save-id");

    if(!txt) {
        txt = getCookie("savedSongs");
    }
    if(txt) {
        editor.innerHTML = `<!-- ${txt[saveId]} -->`;
    }
    const pauseButton = document.getElementById("pause");
    const saveButton = document.getElementById("button");
    saveIdEl.addEventListener("change", (e) => {
        save();
        saveId = parseInt(e.target.value);
        editor.editor.setCode(txt[saveId]? txt[saveId]: "");
    });
    function save() {
        txt[saveId] = editor.editor.code;
        setCookie("savedSongs", JSON.stringify(txt), 999);
        window.localStorage.setItem("funky-funky-music-music", JSON.stringify(txt));
        console.log("save");
    }
    function handleKeyPress(e) {
        if(e.ctrlKey && e.key === "s") {
            e.preventDefault();
            save();
        }
        else if(e.ctrlKey && e.key === "Enter") {
            save();
        }
    }
    function handlePauseToggle() {
        editor.editor.stop();
    }
    document.body.addEventListener("keydown", handleKeyPress);
    saveButton.addEventListener("click", save);
    pauseButton.addEventListener("click", handlePauseToggle);
</script>
<script src="https://unpkg.com/@strudel/repl@latest"></script>
</html>
