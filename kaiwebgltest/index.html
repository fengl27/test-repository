<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jersey+10&family=Jersey+20&family=Tai+Heritage+Pro:wght@400;700&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            html {
                font-size: 2em;
            }
            .inter-font {
                font-family: "Inter", sans-serif;
                font-optical-sizing: auto;
                font-weight: 600;
                font-style: normal;
            }
            #gl-canvas {
                background-color: rgb(13, 11, 41);
                height: calc(100vh - 20px);
                aspect-ratio: 1;
            }
            #slider-container, #gl-canvas {
                border: 2px solid black;
                border-radius: 5px;
            }
            body {
                text-align: center;
                background-image: linear-gradient(30deg, rgb(13, 11, 41), rgb(15, 20, 61));
                margin: 10px;
                color: white;
            }
            #slider-container {
                padding: 20px;
                margin-bottom: 10px;
                background-color: rgb(29, 39, 94);
                text-align: left;
            }
            #slider-container input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                background: transparent;
                cursor: pointer;
                width: 15rem;
            }
            #slider-container input[type="range"]::-webkit-slider-runnable-track {
                background-color: rgb(255, 132, 1);
                height: 0.5rem;
                border: 2px solid black;
            }
            #slider-container input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                background-color: rgb(239, 66, 27);
                width: 1rem;
                height: 1rem;
                border: 2px solid black;
                margin-top: calc(-0.25rem - 2px);
                
            }
        </style>
    </head>
    <body class = "inter-font">
        <canvas id = "gl-canvas"></canvas>

        <div id = "slider-container">
        </div>

        <script src = "shaders.js"></script>
        <script src = "goofy.js"></script>
    </body>
</html>
